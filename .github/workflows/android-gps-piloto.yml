name: "APK piloto GPS Android (experimental)"
on:
  push:
    branches:
      - android-gps-piloto-01
    paths:
      - 'android-gps-piloto/**'
      - '.github/workflows/android-gps-piloto.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar rama de prueba
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android 35 desde runner
        shell: bash
        run: |
          echo "SDK de Android: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK debug del piloto
        working-directory: android-gps-piloto
        run: gradle :app:assembleDebug --no-daemon
      - name: Publicar instalador experimental
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-gps-piloto-android-apk
          path: android-gps-piloto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
